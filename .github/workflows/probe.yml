name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi patchright && patchright install chrome
      - run: xvfb-run -a python probe/vfs_login_page.py nld
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shot, path: shot.png }
