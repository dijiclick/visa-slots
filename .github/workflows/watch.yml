name: watch
# One long run (~5h45m) at a time; the cron keeps a successor queued so the loop never stops.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      minutes: { description: "how long this run loops", default: "345" }
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Keep the schedule alive (GitHub pauses crons after 60 idle days)
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((40*86400)) ]; then
            git -c user.name=visa-slots -c user.email=visa-slots@users.noreply.github.com commit --allow-empty -m "keepalive"
            git push
          fi
      - run: python -m visa_slots.run --minutes ${{ inputs.minutes || '345' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
